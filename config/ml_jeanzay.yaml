# ml_jeanzay.yaml
# Anna Preto
# AstroDeep Project
# Central configuration of the Rubin x Euclid cross-instrument work: paired datasets (D1, D2, controlled blends),
# Stage 1 (Euclid encoder into the frozen DebVAder latent space), Stage 2 (Rubin blend encoder supervised by the
# Euclid teacher) and their evaluations. Environment variables are expanded when the file is read; every value can
# be overridden from the command line with --set section.key=value.
#
# The DebVAder run is never written here: its folder is given on the command line (--debvader-run, or the
# DEBVADER_RUN environment variable), because it lives wherever the campaign left it. paper_baseline (BTK
# simulations, trained without noise) does not reconstruct DP2 stamps (phase 0, 2026-11-17); the reference VAE is
# a DebVAder stage 1 trained from scratch on the Rubin stamps of D1 (section rubin_vae).

# Configuration of the stamp pipeline that produced the isolated-galaxy dataset (patch by patch).
pipeline_config: ${DP2_CONFIG}

# Root of everything this file produces: datasets, runs, evaluations, executed notebooks. Outside the repository.
ml_root: ${DP2_ML_ROOT}

seed: 20261116

rubin:
  bands: [u, g, r, i, z, y]
  stamp_px: 59
  # Units fed to the DebVAder encoder: those of the data the VAE was trained on. "auto" reads them from the run
  # (nJy for a VAE trained on DP2 stamps; lsst_electrons for paper_baseline, trained on BTK simulations, for which
  # nJy are converted to the electrons the same flux gives in the simulated survey, surveycodex zero points and
  # exposure times). An explicit value that disagrees with the run stops the job.
  vae_units: auto
  # Band used for shape measurements (HSM adaptive moments). The stamp pipeline measures in i.
  shape_band: i
  # Masked Rubin pixels (MMU mask True) enter the encoder as 0 in normalised units and get zero weight in losses.
  masked_value_normalised: 0.0

euclid:
  # Where Euclid images come from: "mmu" (image column of the MultimodalUniverse Euclid Q1 HATS catalogue, read on
  # a node with internet access) or "irsa" (MER mosaic cutouts from IRSA; the Jean Zay proxy is reported to block
  # IRSA, see debvader-keras docs/real-data.md). Run `dp2-ml probe-euclid` first on prepost to see what works.
  image_source: mmu
  hats_url: hf://datasets/hugging-science/mmu_euclid_q1/euclid
  # Each MMU partition is one ~30 GB row group: the partitions of all patches are downloaded once by
  # `dp2-ml mmu-mirror` (submit_ml.sh mmu-mirror, prepost) into this folder, then read locally. "auto":
  # $SCRATCH/mmu_euclid_q1 (else $DP2_ML_ROOT/mmu_euclid_q1); null: stream Hugging Face directly (slow).
  # $SCRATCH files untouched for 30 days are purged: the readers check the mirror and ask for a rerun if needed.
  mmu_cache: auto
  # Rows decoded at a time while streaming a partition (memory ~ mmu_batch_rows x a few MB).
  mmu_batch_rows: 64
  # MMU "mask" convention: True marks VALID pixels (probe 2026-11-18: background pixels with ivar > 0 are True, only
  # the saturated core of a star is False). Read as False = do not trust; zero ivar and NaN flux are masked too.
  mmu_mask_true_is_valid: true
  irsa_sia_url: https://irsa.ipac.caltech.edu/SIA
  irsa_collection: euclid_DpdMerBksMosaic
  # Bands kept on disk when present (MER mosaics share a 0.1"/px grid for VIS and NISP).
  bands: [VIS, Y, J, H]
  # Bands read by the Euclid encoder. VIS alone carries the morphology; NISP adds near-infrared colours.
  encoder_bands: [VIS]
  pixel_scale: 0.1
  # 119 px x 0.1" = 11.9", the closest odd size to the 11.8" of a 59 px Rubin stamp.
  stamp_px: 119
  # Nominal VIS PSF FWHM (arcsec), used to build Euclid-resolution ellipses (D2 isolation and masking).
  vis_psf_fwhm: 0.17
  # Rotation added to the catalogue position angle before building ellipses (degrees). Keep 0: the orientation is
  # set by euclid.pa_convention of the stamp pipeline ("measured"), and an offset cannot repair the "copaings"
  # convention (its error depends on each angle). The D1 quality report checks the angle the code actually uses
  # (resolution_and_orientation: used_by_code_median_abs_diff_deg, fail above 15 deg; 45 deg on 2026-11-18 with
  # "copaings").
  pa_offset_deg: 0.0

splits:
  # Splits are drawn by Rubin (tract, patch), the same assignment for every dataset, so that no patch feeds two
  # splits and no Stage 2 test patch has been seen by the Stage 1 teacher.
  fractions: {train: 0.8, val: 0.1, test: 0.1}
  # Pairs of objects closer than this but in different splits are counted in the quality report (border leakage).
  leakage_radius_arcsec: 12.0
  # Patches whose split is set by hand, overriding the draw ("tract_patch": train | val | test). The 9 patches of
  # the first scale run (tract 5063, patches 23-25, 33-35, 43-45) drew 8 train, 1 val (5063_33), 0 test: the
  # opposite corner of the block is taken as test. Set before D1 is built: changing it means rebuilding D1, D2,
  # the blends and the Rubin VAE training set (--force).
  fixed: {"5063_45": test}

dataset1:
  # D1 = final dataset of the stamp pipeline (every cut of the recipe applied, masking included) with a Euclid image.
  # Nothing is re-selected here: the pair-level checks below are recorded, and only unusable pairs are dropped
  # (no Euclid image, no valid pixel), each with its reason in rejected.parquet.
  max_astrometric_offset_arcsec: 0.3   # recorded flag, not a cut
  min_valid_fraction_euclid: 0.9       # below this the pair is rejected (reason recorded)
  # Targets sharing their detection footprint with a companion keep its wings (white sky-filled disc in a dark halo,
  # step along the footprint edge; seen in the D1 notebook on 2026-11-19). Rejected when more than this fraction
  # of the light kept in the target footprint lies in the companions' part of it (stamp column shared_light_frac).
  # null: no cut. Provisional value; tune it on the distribution in the D1 quality report (D1 rebuild only).
  max_shared_light_frac: 0.2
  contamination_radius_arcsec: 3.0     # other Euclid sources inside this radius are counted per pair
  contamination_delta_mag: 2.5         # ... if brighter than target VIS mag + this
  # Conditioning features of the Euclid encoder: Rubin PSF of the stamp (known at inference, Rubin-side metadata).
  cond_features: [psf_sigma_u, psf_sigma_g, psf_sigma_r, psf_sigma_i, psf_sigma_z, psf_sigma_y,
                  psf_e1_u, psf_e1_g, psf_e1_r, psf_e1_i, psf_e1_z, psf_e1_y,
                  psf_e2_u, psf_e2_g, psf_e2_r, psf_e2_i, psf_e2_z, psf_e2_y]

rubin_vae:
  # Training set of the reference Rubin VAE: the Rubin stamps of D1 written as a debvader-keras "real build"
  # (images.npy in nJy, meta.npz with the D1 split, stats.json), trained from scratch with debvader-keras' own
  # trainer (scripts/train.py --stage 1) and the architecture of the template run (paper_baseline).
  # Masked pixels (neighbours, bad pixels) are replaced by Gaussian noise at the sky level of their stamp and band,
  # as build_stage1_real.py does: the VAE never sees holes, and its target is the stamp itself.
  min_valid_fraction: 0.7        # stamps with fewer unmasked pixels than this (any band) are left out
  stats_max_stamps: 20000        # train stamps drawn for scale_per_band (99.9th percentile of |flux|, as debvader)
  run_name: dp2_d1_real          # name of the debvader-keras run (EXPERIMENTS_DIR/<run_name>)
  # Overrides of the template run's config.json (dotted keys). Data: the real build, every stamp of each split
  # (sizes 0 = all), no S/N cut (the cut is for shape heads, absent here), no cache (a re-export must be read).
  debvader_overrides:
    data.real_min_snr: 0.0
    data.train_size: 0
    data.validation_size: 0
    data.cache_data: false
    data.use_btk: false
    data.use_sample_weighting: false

stage1:
  euclid_encoder:
    filters: [32, 64, 128, 256, 256]
    cond_embedding: 64
    dense: 512
  latent_loss: mu_whitened      # mu_mse | mu_whitened | gaussian_kl
  cross_loss: normalised_mse    # normalised_mse | gaussian_nll | chi2_physical
  cross_target: observation     # observation | reference_reconstruction
  band_weights: [1, 1, 1, 1, 1, 1]
  contrastive:
    projection_dims: [256, 128]
    temperature: 0.07
    learn_temperature: true
    space: mu                    # projections of the posterior means (the only option implemented)
  weights: {latent: 1.0, cross: 1.0, infonce: 0.0}
  # Random elliptical holes filled with sky from the same stamp, so that the encoder meets the masked inputs of D2.
  mask_augment_prob: 0.3
  augment_flips: true            # same flip / 90 degree rotation applied to the Euclid input and the Rubin target
  batch_size: 128
  epochs: 300
  learning_rate: 0.0003
  clipnorm: 1.0
  early_stopping_patience: 30
  # Ablations of section 6C: run names and the loss weights each one overrides.
  ablations:
    s1_latent: {latent: 1.0, cross: 0.0, infonce: 0.0}
    s1_latent_cross: {latent: 1.0, cross: 1.0, infonce: 0.0}
    s1_latent_cross_clip: {latent: 1.0, cross: 1.0, infonce: 0.1}

stage1_acceptance:
  # Viability gate for moving to Stage 2. These numbers are proposals to be validated, not results: they compare
  # the Euclid path D_R(E_E(x_E)) with the reference Rubin path D_R(E_R(x_R)) on the D1 test split.
  # - ellipticity bias between the two paths, per component: well below the 0.02 the recipe tolerates for masking;
  max_mean_delta_e: 0.005
  # - multiplicative and additive terms of the linear fit e_cross = (1 + m) e_ref + c;
  max_abs_m: 0.05
  max_abs_c: 0.005
  # - the Euclid path may deviate from the observed shape at most this factor more than the reference path does;
  max_scatter_ratio: 1.25
  # - flux bias and scatter between the two paths, in r, i, z (aperture of radius flux_aperture_px);
  flux_bands: [r, i, z]
  flux_aperture_px: 8
  max_median_flux_bias: 0.02
  max_flux_scatter: 0.05
  # - centroid offset between the two reconstructions, in Rubin pixels.
  max_median_centroid_offset_px: 0.1

dataset2:
  sb_rubin_min: 0.0              # Rubin group blended: max S_b of its Rubin members > this
  sb_euclid_max: 0.0             # Euclid target alone at Euclid resolution: Euclid-side S_b <= this
  max_euclid_in_group: 2         # start with two-component groups
  overlap_grid_px: 0.05          # grid step (Rubin px) of the ellipse overlap fraction
  # Separation test on the Euclid image: other Euclid sources masked over k times their Euclid-resolution ellipse,
  # holes filled with empty sky of the same cutout, target measured before and after (HSM, VIS).
  mask_k: 2.0
  accept:
    max_delta_e: 0.02
    max_centroid_shift_arcsec: 0.05
    max_rel_size_change: 0.05
    max_rel_flux_change: 0.05
    max_masked_fraction_in_target: 0.10
  # Rubin pixel quality of the blend stamp (same planes as the recipe).
  bad_planes: [SATURATED, COSMIC_RAY, INTERPOLATED, DETECTION_EDGE]
  k_ellipse_bad_pixels: 3.0
  # A scene is "complete" when no other Euclid source brighter than target VIS mag + this lies in the Rubin stamp:
  # only complete scenes enter the scene-consistency loss.
  scene_complete_delta_mag: 3.0

controlled_blends:
  n_per_split: {val: 2000, test: 4000}
  separation_px: [2.0, 12.0]     # integer shifts drawn in this range of radius
  flux_ratio: [0.1, 1.0]         # i-band flux companion / target; the companion stamp is scaled down to it
                                 # (companions fainter than that are not drawn; noise scaled with it, recorded)
  same_patch: true               # companion from the same patch: same PSF to first order

stage2:
  centering: euclid              # euclid (oracle: stamp centred on the Euclid target) | rubin (Rubin-only)
  init: stage1                   # warm start of the blend encoder: stage1 (reference encoder) | stage2 (DebVAder
                                 # deblender, only for a run that has one, e.g. paper_baseline) | random
  latent_loss: mu_whitened
  contrastive:
    projection_dims: [256, 128]
    temperature: 0.07
    learn_temperature: true
    # Negatives whose teacher latents are closer than this quantile of all pairwise distances are not used
    # (morphological twins would otherwise be pushed apart).
    negative_mask_quantile: 0.01
  scene:
    enabled: false
    weight: 1.0
  weights: {latent: 1.0, infonce: 0.0}
  batch_size: 128
  epochs: 300
  learning_rate: 0.0001
  clipnorm: 1.0
  early_stopping_patience: 30
  ablations:
    s2_latent: {latent: 1.0, infonce: 0.0, scene: 0.0}
    s2_latent_clip: {latent: 1.0, infonce: 0.1, scene: 0.0}
    s2_latent_scene: {latent: 1.0, infonce: 0.0, scene: 1.0}

evaluation:
  bins:
    i_cModel_mag: [18, 21, 22, 23, 24, 25]
    snr_i: [5, 20, 50, 100, 1000, 1000000.0]
    sigma_hsm: [0, 1.5, 2.0, 3.0, 5.0, 100]     # HSM sigma in Rubin pixels
    psf_sigma_i: [0, 0.3, 0.35, 0.4, 0.45, 1.0]
    sb_rubin: [0, 0.1, 0.3, 0.5, 0.7, 2.0]
    separation_arcsec: [0, 0.5, 1.0, 1.5, 2.0, 5.0]
  retrieval_k: [1, 5, 10]
  bootstrap: 200
  n_examples_figures: 24
