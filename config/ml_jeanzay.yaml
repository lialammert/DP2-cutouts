# ml_jeanzay.yaml
# Anna Preto
# AstroDeep Project
# Central configuration of the Rubin x Euclid cross-instrument work: paired datasets (D1, D2, controlled blends),
# Stage 1 (Euclid encoder into the frozen DebVAder latent space), Stage 2 (Rubin blend encoder supervised by the
# Euclid teacher) and their evaluations. Environment variables are expanded when the file is read; every value can
# be overridden from the command line with --set section.key=value.
#
# The DebVAder run is never written here: its folder is given on the command line (--debvader-run, or the
# DEBVADER_RUN environment variable), because it lives wherever the campaign left it. paper_baseline (BTK
# simulations, trained without noise) does not reconstruct DP2 stamps (phase 0, 2026-11-17); the reference VAE is
# a DebVAder stage 1 trained from scratch on the Rubin stamps of D1 (section rubin_vae).

# Configuration of the stamp pipeline that produced the isolated-galaxy dataset (patch by patch).
pipeline_config: ${DP2_CONFIG}

# Root of everything this file produces: datasets, runs, evaluations, executed notebooks. Outside the repository.
ml_root: ${DP2_ML_ROOT}

seed: 20261116

rubin:
  bands: [u, g, r, i, z, y]
  stamp_px: 59
  # Units fed to the DebVAder encoder: those of the data the VAE was trained on. "auto" reads them from the run
  # (nJy for a VAE trained on DP2 stamps; lsst_electrons for paper_baseline, trained on BTK simulations, for which
  # nJy are converted to the electrons the same flux gives in the simulated survey, surveycodex zero points and
  # exposure times). An explicit value that disagrees with the run stops the job.
  vae_units: auto
  # Band used for shape measurements (HSM adaptive moments). The stamp pipeline measures in i.
  shape_band: i
  # Masked Rubin pixels (MMU mask True) enter the encoder as 0 in normalised units and get zero weight in losses.
  masked_value_normalised: 0.0

euclid:
  # Where Euclid images come from: "mmu" (image column of the MultimodalUniverse Euclid Q1 HATS catalogue, read on
  # a node with internet access) or "irsa" (MER mosaic cutouts from IRSA; the Jean Zay proxy is reported to block
  # IRSA, see debvader-keras docs/real-data.md). Run `dp2-ml probe-euclid` first on prepost to see what works.
  image_source: mmu
  hats_url: hf://datasets/hugging-science/mmu_euclid_q1/euclid
  # Each MMU partition is one ~30 GB row group: the partitions of all patches are downloaded once by
  # `dp2-ml mmu-mirror` (submit_ml.sh mmu-mirror, prepost) into this folder, then read locally. "auto":
  # $SCRATCH/mmu_euclid_q1 (else $DP2_ML_ROOT/mmu_euclid_q1); null: stream Hugging Face directly (slow).
  # $SCRATCH files untouched for 30 days are purged: the readers check the mirror and ask for a rerun if needed.
  mmu_cache: auto
  # Rows decoded at a time while streaming a partition (memory ~ mmu_batch_rows x a few MB).
  mmu_batch_rows: 64
  # MMU "mask" convention: True marks VALID pixels (probe 2026-11-18: background pixels with ivar > 0 are True, only
  # the saturated core of a star is False). Read as False = do not trust; zero ivar and NaN flux are masked too.
  mmu_mask_true_is_valid: true
  irsa_sia_url: https://irsa.ipac.caltech.edu/SIA
  irsa_collection: euclid_DpdMerBksMosaic
  # Bands kept on disk when present (MER mosaics share a 0.1"/px grid for VIS and NISP).
  bands: [VIS, Y, J, H]
  # Bands read by the Euclid encoder. VIS alone carries the morphology; NISP adds near-infrared colours.
  encoder_bands: [VIS]
  pixel_scale: 0.1
  # 119 px x 0.1" = 11.9", the closest odd size to the 11.8" of a 59 px Rubin stamp.
  stamp_px: 119
  # Nominal VIS PSF FWHM (arcsec), used to build Euclid-resolution ellipses (D2 isolation and masking).
  vis_psf_fwhm: 0.17
  # Rotation added to the catalogue position angle before building ellipses (degrees). Keep 0: the orientation is
  # set by euclid.pa_convention of the stamp pipeline ("measured"), and an offset cannot repair the "copaings"
  # convention (its error depends on each angle). The D1 quality report checks the angle the code actually uses
  # (resolution_and_orientation: used_by_code_median_abs_diff_deg, fail above 15 deg; 45 deg on 2026-11-18 with
  # "copaings").
  pa_offset_deg: 0.0

splits:
  # Splits are drawn by Rubin (tract, patch), the same assignment for every dataset, so that no patch feeds two
  # splits and no Stage 2 test patch has been seen by the Stage 1 teacher.
  # train fits the networks, val chooses (early stopping, settings), test validates each stage (Rubin VAE, Stage 1,
  # Stage 2) before the next one, holdout is read by no training nor choice: the final evaluation only.
  fractions: {train: 0.7, val: 0.1, test: 0.1, holdout: 0.1}
  # Pairs of objects closer than this but in different splits are counted in the quality report (border leakage).
  leakage_radius_arcsec: 12.0
  # Patches whose split is set by hand, overriding the draw ("tract_patch": train | val | test | holdout). Empty for
  # the EDF-F + EDF-S run (hundreds of patches). The 9-patch scale run of 2026-11 was built with
  # fractions {train: 0.8, val: 0.1, test: 0.1} and fixed {"5063_45": test} (the hash left it without a test
  # patch). Set before D1 is built: changing it means rebuilding D1, D2, the blends and the Rubin VAE training set.
  fixed: {}

dataset1:
  # D1 = final dataset of the stamp pipeline (every cut of the recipe applied, masking included) with a Euclid image.
  # Nothing is re-selected here: the pair-level checks below are recorded, and only unusable pairs are dropped
  # (no Euclid image, no valid pixel), each with its reason in rejected.parquet.
  max_astrometric_offset_arcsec: 0.3   # recorded flag, not a cut
  min_valid_fraction_euclid: 0.9       # below this the pair is rejected (reason recorded)
  # Masking leaves the wings of companions (white sky-filled disc in a dark halo, step along the footprint edge;
  # seen in the D1 notebook on 2026-11-19). Rejected when the companions' predicted light (exponential profiles
  # from catalogue ellipses and fluxes) on the kept pixels within 3 target ellipses exceeds this fraction of the
  # target's own light there (stamp column companion_light_ratio). Two earlier versions measured the light kept in
  # the whole target footprint: noise and far-away pixels made faint isolated targets look contaminated (>50 %).
  # null: no cut. Provisional value; tune it on the distribution in the D1 quality report (D1 rebuild only).
  max_companion_light_ratio: 0.1
  # Measured alternative (raw image): significance of the light left in a ring 1-4 px outside the masks, away
  # from the target (stamp column halo_ring_z). Unlike the predicted ratio it does not penalise tight masks.
  # null: off. To replace the predicted cut, set this and max_companion_light_ratio: null.
  max_halo_ring_z: null
  # Euclid pixels of the other sources on each D1 cutout, flagged as in D2 (array euclid_fill; pixels unchanged):
  # segmentation (MER segments, ellipses where no tile covers the cutout) | ellipse | null (off, earlier builds).
  # Needed by the deblending campaign, whose Euclid inputs must be treated alike in D1 and D2.
  euclid_neighbour_mask: segmentation
  contamination_radius_arcsec: 3.0     # other Euclid sources inside this radius are counted per pair
  contamination_delta_mag: 2.5         # ... if brighter than target VIS mag + this
  # Conditioning features of the Euclid encoder: Rubin PSF of the stamp (known at inference, Rubin-side metadata).
  cond_features: [psf_sigma_u, psf_sigma_g, psf_sigma_r, psf_sigma_i, psf_sigma_z, psf_sigma_y,
                  psf_e1_u, psf_e1_g, psf_e1_r, psf_e1_i, psf_e1_z, psf_e1_y,
                  psf_e2_u, psf_e2_g, psf_e2_r, psf_e2_i, psf_e2_z, psf_e2_y]

rubin_vae:
  # Training set of the reference Rubin VAE: the Rubin stamps of D1 written as a debvader-keras "real build"
  # (images.npy in nJy, meta.npz with the D1 split, stats.json), trained from scratch with debvader-keras' own
  # trainer (scripts/train.py --stage 1) and the architecture of the template run (paper_baseline).
  # Masked pixels (neighbours, bad pixels) are replaced by Gaussian noise at the sky level of their stamp and band,
  # as build_stage1_real.py does: the VAE never sees holes, and its target is the stamp itself.
  min_valid_fraction: 0.7        # stamps with fewer unmasked pixels than this (any band) are left out
  stats_max_stamps: 20000        # train stamps drawn for scale_per_band (99.9th percentile of |flux|, as debvader)
  # Name of the debvader-keras run (EXPERIMENTS_DIR/<run_name>). A new name for every rebuild: train.py --resume would
  # otherwise continue the previous run. dp2_d1_real (2026-11-19): ReLU decoder mean, y band dead.
  run_name: dp2_d1_pipeline_linear
  # Overrides of the template run's config.json (dotted keys). Data: the real build, every stamp of each split
  # (sizes 0 = all), no S/N cut (the cut is for shape heads, absent here), no cache (a re-export must be read).
  debvader_overrides:
    # Linear decoder mean: with the original ReLU the y output died (all pre-activations < 0, no gradient left; audit
    # of dp2_d1_real, 2026-11-22). The scale keeps the original ReLU (softplus to be tested on its own).
    model.output_mean_activation: linear
    data.real_min_snr: 0.0
    data.train_size: 0
    data.validation_size: 0
    data.cache_data: false
    data.use_btk: false
    data.use_sample_weighting: false

stage1:
  euclid_encoder:
    filters: [32, 64, 128, 256, 256]
    cond_embedding: 64
    dense: 512
    # Dropout on the dense part of E_E (training only; 0 = none). Earlier CLIP experiments on DebVAder latents did
    # not work without dropout: its effect is tested by the *_dropout ablations. The Rubin VAE stays frozen.
    dropout: 0.0
  # Direct matching in the latent space of the frozen Rubin decoder. mu_whitened (each direction divided by its
  # spread, which can overweight nearly inactive dimensions) is the s1_latent_cross_whitened ablation.
  latent_loss: mu_mse           # mu_mse | mu_whitened | gaussian_kl
  cross_loss: normalised_mse    # normalised_mse | gaussian_nll | chi2_physical
  cross_target: observation     # observation | reference_reconstruction
  band_weights: [1, 1, 1, 1, 1, 1]
  contrastive:
    projection_dims: [256, 128]
    temperature: 0.07
    learn_temperature: true
    space: mu                    # projections of the posterior means (the only option implemented)
  # Main losses: latent matching and Rubin cross-reconstruction. InfoNCE is an optional term whose coefficient is
  # lambda_NCE = weights.infonce (0: off, no projection heads are built). Whether it helps is tested, not assumed:
  # the ablations s1_latent_cross and s1_latent_cross_nce differ by that term only.
  weights: {latent: 1.0, cross: 1.0, infonce: 0.0}
  # Random elliptical holes filled with sky from the same stamp, so that the encoder meets the masked inputs of D2.
  mask_augment_prob: 0.3
  augment_flips: true            # same flip / 90 degree rotation applied to the Euclid input and the Rubin target
  batch_size: 128
  epochs: 300
  learning_rate: 0.0003
  clipnorm: 1.0
  early_stopping_patience: 30
  # Scale of the full EDF-F + EDF-S run (an epoch is thousands of steps). null: as before.
  #   train_steps         budget in optimisation steps, turned into epochs (then `epochs` is not used)
  #   backup_every_steps  resumable backup every that many steps (else every epoch; jobs of the 2 h dev QoS)
  #   val_max_examples    validation on a fixed random subset of val (else the whole split, each epoch)
  train_steps: null
  backup_every_steps: null
  val_max_examples: null
  # Ablations of section 6C: run names, the loss weights each one overrides, and optionally latent_loss and the
  # Euclid encoder dropout.
  #   s1_latent_cross              main losses only (reference)
  #   s1_latent_cross_nce          the same plus InfoNCE, lambda_NCE = its infonce weight
  #   s1_latent_cross_dropout      reference with dropout in E_E
  #   s1_latent_cross_nce_dropout  InfoNCE and dropout (2 x 2 with the three above: each effect and their pairing)
  #   s1_latent_cross_whitened     reference with the whitened latent loss
  #   s1_latent                    latent matching alone (what the cross-reconstruction adds); not a priority
  ablations:
    s1_latent_cross: {latent: 1.0, cross: 1.0, infonce: 0.0}
    s1_latent_cross_nce: {latent: 1.0, cross: 1.0, infonce: 0.1}
    s1_latent_cross_dropout: {latent: 1.0, cross: 1.0, infonce: 0.0, dropout: 0.1}
    s1_latent_cross_nce_dropout: {latent: 1.0, cross: 1.0, infonce: 0.1, dropout: 0.1}
    s1_latent_cross_whitened: {latent: 1.0, cross: 1.0, infonce: 0.0, latent_loss: mu_whitened}
    s1_latent: {latent: 1.0, cross: 0.0, infonce: 0.0}
  # Launched by `submit_ml.sh stage1` when no run is named (any ablation can still be named explicitly).
  default_runs: [s1_latent_cross, s1_latent_cross_nce, s1_latent_cross_dropout, s1_latent_cross_nce_dropout]

stage1_acceptance:
  # Viability gate for moving to Stage 2. These numbers are proposals to be validated, not results: they compare
  # the Euclid path D_R(E_E(x_E)) with the reference Rubin path D_R(E_R(x_R)) on the D1 test split.
  # - ellipticity bias between the two paths, per component: well below the 0.02 the recipe tolerates for masking;
  max_mean_delta_e: 0.005
  # - multiplicative and additive terms of the linear fit e_cross = (1 + m) e_ref + c;
  max_abs_m: 0.05
  max_abs_c: 0.005
  # - the Euclid path may deviate from the observed shape at most this factor more than the reference path does;
  max_scatter_ratio: 1.25
  # - flux bias and scatter between the two paths, in r, i, z (aperture of radius flux_aperture_px);
  flux_bands: [r, i, z]
  flux_aperture_px: 8
  max_median_flux_bias: 0.02
  max_flux_scatter: 0.05
  # - centroid offset between the two reconstructions, in Rubin pixels.
  max_median_centroid_offset_px: 0.1

dataset2:
  sb_rubin_min: 0.0              # Rubin group blended: max S_b of its Rubin members > this
  sb_euclid_max: 0.0             # Euclid target alone at Euclid resolution: Euclid-side S_b <= this
  max_euclid_in_group: 2         # start with two-component groups
  overlap_grid_px: 0.05          # grid step (Rubin px) of the ellipse overlap fraction
  # Separation test on the Euclid image: other Euclid sources masked, holes filled with empty sky of the same
  # cutout, target measured before and after (HSM, VIS). euclid_masking: segmentation = their Euclid MER segments
  # (the pipeline's product, on its own VIS grid; tiles downloaded by the pipeline's fetch, masking.seg_cache),
  # grown by seg_grow_px VIS pixels; ellipse = mask_k times their Euclid-resolution ellipse (also the fallback where
  # no tile covers a cutout, recorded in the column euclid_masking).
  euclid_masking: segmentation
  seg_grow_px: 2
  mask_k: 2.0
  # Acceptance of the masked Euclid stamp. mask_quality: target barely masked, VIS S/N of the target on the masked
  # stamp >= min_snr_vis (aperture: reduced radius <= snr_aperture_k), neighbour light left around the masks
  # (halo_ring_z, ring of halo_ring_px VIS pixels) <= max_halo_ring_z, aperture flux / catalogue VIS flux within
  # max_rel_flux_vs_catalog of 1 (null: recorded, not applied). moments: the former before / after HSM test
  # (max_delta_e ... max_rel_flux_change), which rejects most blends with a brighter partner (the raw measurement is
  # pulled by it); its numbers are recorded in both cases.
  separation_test: mask_quality
  accept:
    max_masked_fraction_in_target: 0.10
    min_snr_vis: 5.0                 # D1's own cut is Rubin S/N_i > 5; 10 cut D2 0.5 mag brighter than D1
    snr_aperture_k: 1.5
    halo_ring_px: 4
    max_halo_ring_z: null
    max_rel_flux_vs_catalog: null
    max_delta_e: 0.02
    max_centroid_shift_arcsec: 0.05
    max_rel_size_change: 0.05
    max_rel_flux_change: 0.05
  # Rubin pixel quality of the blend stamp (same planes as the recipe).
  bad_planes: [SATURATED, COSMIC_RAY, INTERPOLATED, DETECTION_EDGE]
  k_ellipse_bad_pixels: 3.0
  # A scene is "complete" when no other Euclid source brighter than target VIS mag + this lies in the Rubin stamp:
  # only complete scenes enter the scene-consistency loss.
  scene_complete_delta_mag: 3.0

controlled_blends:
  n_per_split: {val: 2000, test: 4000, holdout: 4000}
  separation_px: [2.0, 12.0]     # integer shifts drawn in this range of radius
  flux_ratio: [0.1, 1.0]         # i-band flux companion / target; the companion stamp is scaled down to it
                                 # (companions fainter than that are not drawn; noise scaled with it, recorded)
  same_patch: true               # companion from the same patch: same PSF to first order

stage2:
  centering: euclid              # euclid (oracle: stamp centred on the Euclid target) | rubin (Rubin-only)
  init: stage1                   # warm start of the blend encoder: stage1 (reference encoder) | stage2 (DebVAder
                                 # deblender, only for a run that has one, e.g. paper_baseline) | random
  latent_loss: mu_mse            # direct matching to the teacher latent; mu_whitened: the s2_latent_whitened ablation
  contrastive:
    projection_dims: [256, 128]
    temperature: 0.07
    learn_temperature: true
    # Negatives whose teacher latents are closer than this quantile of all pairwise distances are not used
    # (morphological twins would otherwise be pushed apart).
    negative_mask_quantile: 0.01
  scene:
    enabled: false
    weight: 1.0
  # Main loss: latent matching to the frozen Euclid teacher. No InfoNCE for now (the code path stays, off at 0;
  # to be reconsidered only if the Stage 1 ablation shows a benefit).
  weights: {latent: 1.0, infonce: 0.0}
  batch_size: 128
  epochs: 300
  learning_rate: 0.0001
  clipnorm: 1.0
  early_stopping_patience: 30
  # As in stage1: train_steps, backup_every_steps, val_max_examples (null: as before).
  train_steps: null
  backup_every_steps: null
  val_max_examples: null
  # s2_latent_scene: optional, not launched for now (first check that the scene consistency is physically defined).
  ablations:
    s2_latent: {latent: 1.0, infonce: 0.0, scene: 0.0}
    s2_latent_whitened: {latent: 1.0, infonce: 0.0, scene: 0.0, latent_loss: mu_whitened}
    s2_latent_scene: {latent: 1.0, infonce: 0.0, scene: 1.0}
  default_runs: [s2_latent]

evaluation:
  bins:
    i_cModel_mag: [18, 21, 22, 23, 24, 25]
    snr_i: [5, 20, 50, 100, 1000, 1000000.0]
    sigma_hsm: [0, 1.5, 2.0, 3.0, 5.0, 100]     # HSM sigma in Rubin pixels
    psf_sigma_i: [0, 0.3, 0.35, 0.4, 0.45, 1.0]
    sb_rubin: [0, 0.1, 0.3, 0.5, 0.7, 2.0]
    separation_arcsec: [0, 0.5, 1.0, 1.5, 2.0, 5.0]
  retrieval_k: [1, 5, 10]
  bootstrap: 200
  n_examples_figures: 24

# ----------------------------------------------------------------------------------------------------------------
# Deblending campaign (2026-11-24): three probabilistic deblenders compared on real D1 / D2, weak lensing first.
#   Run A: K1 Euclid VIS VAE + K2 Rubin decoder from the Euclid latent (both frozen), MC-dropout student (latent MSE)
#   Run B: same K1 / K2, CFM student;  Run C: joint VAE C1, conditional teacher C2, CFM student C3.
# Commands: dp2-ml <cfg> deblend-stats | deblend-train <stage> | deblend-eval <what>; scripts/jeanzay/ml/
# submit_deblend.sh pilot | all | seeds | final. Design and rules: docs/deblend.md. The stage1 / stage2 /
# stage1_acceptance / controlled_blends / evaluation sections above belong to the archived architecture.
deblend:
  euclid_band: VIS                 # NIR bands left out until their flux scale is established
  latent_dim: 32
  d2_centering: rubin              # rubin: Rubin-only input (target = Euclid member nearest the Rubin centre)
  d2_selection:                    # D2 targets used for training and evaluation (D2 itself unchanged), 2026-11-26
    # Masking the neighbours must leave the VIS measurement of the target unchanged: keeps ~28 % of D2. Injecting
    # real D2 masks on isolated D1 galaxies (scripts/inspect/mask_damage.py) showed that the targets failing it are
    # ~4x more often damaged by their masks (shape changed by > 0.02) than those passing it.
    before_after: {max_delta_e: 0.02, max_centroid_shift_arcsec: 0.05, max_rel_size_change: 0.05,
                   max_rel_flux_change: 0.05}
    vis_mag_max: auto              # auto: the vis_mag_quantile of the D1 train VIS magnitudes (D1 = Rubin S/N_i > 5),
    vis_mag_quantile: 0.95         # so that D2 targets are galaxies Rubin detects; null: no magnitude cut
    euclid_cut1: true              # D1's cut 1 on the target: Euclid object neither point-like nor spurious (copaings
                                   # removes Rubin point sources only); needs d2/euclid_flags.parquet (dp2-ml d2-flags)
    max_lost_flux_frac: 0.03       # 2026-11-27: target VIS light hidden by the neighbour masks (point symmetry,
    lost_sigma: 3.0                # pairs/mask_loss.py) above 3 % and above 3 uncertainties: left out. Needs
                                   # d2/mask_loss.parquet (dp2-ml mask-loss d2). null: off
  d1_selection:                    # D1 pairs used for training and evaluation (D1 itself unchanged), 2026-11-27
    max_lost_flux_frac: 0.03       # Rubin i light of the target hidden by the neighbour masks (replaced by sky in D1),
    lost_sigma: 3.0                # same rule as D2; ~9 % of D1 on the preview sample. Needs d1/mask_loss.parquet
                                   # (dp2-ml mask-loss d1). null: off
  require_d1_euclid_fill: true     # refuse a D1 built without dataset1.euclid_neighbour_mask
  data:                            # how the loaders read (deblend/compact.py), 2026-11-27
    compact: true                  # from the compact copies (flux + weight, VIS only; identical batches): dp2-ml
                                   # deblend-compact d1 / d2 first. The pilot read 712 kB per D1 pair, 4 Euclid bands
    require_compact: true          # refuse to train without an up-to-date copy (else: original arrays, slow)
    compact_d1: [euclid, rubin]    # D1 sides copied (rubin: +248 GB, but one read instead of three and no
                                   # noise fill per batch: every loader path is then the fast one)
    in_memory: [d2]                # training rows copied into memory (D2 train ~32 GB) when they fit
    memory_fraction: 0.6           # ... in this fraction of the job's memory limit, else kept memory-mapped
    normalise_on: gpu              # arcsinh(2.5 f / s_b) in the encoders (layers.normalise_input), not in the
                                   # loader threads; same function. bench 902314: D2 loader 2.8k -> 8k ex/s
                                   # (no tanh since 2026-11-28: nothing in the copies depends on it)
  psf_condition: true              # 2026-11-28: the Rubin PSF moments (sigma, e1, e2 x 6 bands, already in the D1 / D2
                                   # metadata; deblend/psf_stats.json) appended to every Rubin embedding and to the
                                   # latent of every Rubin decoder; no Euclid PSF (constant VIS FWHM only)
  stats_max_examples: 20000
  seed: 20261124
  replicate_dependencies: false    # seeds replicate the students (A, B, C2, C3); K1, K2, C1 shared
  run_suffix: ""                   # "_pilot" for the pilots (submit_deblend.sh pilot)
  # dbl2_*: the recipe of 2026-11-28 (new names: the dbl_* runs and pilots of the former recipe stay untouched)
  runs: {rubin_vae: dbl2_rubin_vae, k1: dbl2_k1, k2: dbl2_k2, A: dbl2_runA, B: dbl2_runB, c1: dbl2_c1,
         c2: dbl2_c2, c3: dbl2_c3}
  campaign:                        # self-advancing Slurm campaign (deblend/campaign.py, submit_deblend.sh)
    qos: qos_gpu_a100-dev          # QoS whose queued jobs are counted (overridden by --qos= in DP2_GPU_EXTRA)
    max_queued: 32                 # jobs of the user in the GPU QoS before the campaign waits (the dev QoS refused
                                   # more than ~10; qos_gpu-t3 on V100 does not, and other jobs of the user count)
    max_jobs_train: 30             # 2 h jobs per training before giving up (walltime kills, node failures)
    max_jobs_eval: 2
    gates: {k2: [k1], A: [k1, k2], B: [k1, k2], c2: [c1]}   # wait for dp2-ml deblend-approve (mode all only)
  train:                           # common recipe (2026-11-28); deblend.<stage>.train overrides it
    batch_size: 128
    learning_rate: 1.0e-4          # peak of the schedule (debvader-keras real stage 1: Adam, batch 128)
    global_clipnorm: null          # threshold on the norm of the whole gradient, set per stage below: the 95 %
                                   # quantile of the norms measured by the unclipped pilot of 2026-11-28 after its
                                   # warm-up (C2: after lambda_D1 was fixed), scripts/inspect/clip_thresholds.py;
                                   # logged per epoch: grad_norm_q50 ... q99, clipped_frac (optim.DeblendAdam)
    lr_scaling: sqrt               # larger batches (data-parallel stages): peak lr x sqrt(B / 128)
    lr_reference_batch: 128
    warmup_frac: 0.02              # linear warm-up from 1 % of the peak over the first 2 % of the updates,
    final_lr_frac: 0.01            # then cosine decay to 1 % of the peak at the last update
    train_examples: null           # budget in epochs (below); a number of examples here would override it
    train_steps: null
    epochs: 20                     # D1 stages (rubin_vae, k1, k2, c1); the D2 stages set 60 (an epoch = one pass
                                   # over D2 plus as many D1 replay examples)
    early_stopping_patience: 10    # safety net only (the cosine sets the end); the best val checkpoint is kept
    backup_every_steps: 2000       # resumable backups: 2 h dev-QoS jobs chained
    val_max_examples: 20000
    read_block: auto               # compact copy (shuffled): batch / 4 consecutive rows per read; else 16 rows
                                   # (deblend/data.py Batches). Before: blocks of 16 consecutive rows:
                                   # the pilot read rows one by one, 5-9 s per step on Lustre
    workers: auto                  # threads preparing batches ahead of the GPU (auto: the job's cores)
    gpus: 1                        # data parallel over this many GPUs (batch_size per GPU); per stage below
  # VAEs: beta = 1 reached by a linear KL warm-up over the first 10 % of the updates (validation always at beta = 1);
  # checkpoint before their dependents: campaign evaluations check_vaes / check_k2, then deblend-approve.
  # global_clipnorm: pilot Q95 (Q50 / Q99 in the comments).
  rubin_vae: {beta: 1.0, kl_warmup_frac: 0.1,
              train: {global_clipnorm: 1.06e+6}}             # Q50 8.4e4, Q99 2.7e6
  k1: {beta: 1.0, kl_warmup_frac: 0.1, mask_augment_prob: 0.0, mask_pool_size: 5000,
       train: {gpus: 4, global_clipnorm: 6.68e+4}}           # Q50 1.5e4, Q99 1.1e5; pilot: 1 360 ex/s on 4 V100
  k2: {train: {global_clipnorm: 3.76e+5}}                    # Q50 5.3e4, Q99 1.9e6
  # Students: D2 and a D1 replay 50 / 50 (replay: true), 60 epochs, best checkpoint on their D2 validation term.
  A: {embed: 128, dropout: 0.1, draws: 8, val_draws: 32, replay: true, lambda_replay: 1.0, standardise: true,
      stats_batches: 100, train: {epochs: 60, global_clipnorm: 11.9}}   # Q50 6.7, Q99 13.3; energy score of
                                                                         # 8 dropout draws against one K1 draw
  B: {context: 128, hidden: [128, 128, 128, 128, 128], time_dim: 32, standardise: true, stats_batches: 100,
      replay: true, lambda_replay: 1.0, ema: 0.999, val_triplets: 8,
      train: {epochs: 60, global_clipnorm: 13.3}}                # Q50 1.3, Q99 94
  c1: {embed: 128, fusion: [256], beta: 1.0, kl_warmup_frac: 0.1, weight_r: 1.0, weight_e: 1.0,
       train: {gpus: 4, global_clipnorm: 7.50e+5}}           # Q50 1.3e5, Q99 9.4e5; pilot: autotuning level 0
  # lambda_d1 auto: 1 for 500 updates, gradient norms measured over the next 200, ramp to their median ratio over
  # 200, then fixed (models.LAMBDA_PROTOCOL; <run>/lambda_d1.json); checkpoints counted from then on.
  c2: {embed: 128, fusion: [256], lambda_d1: auto,
       lambda_protocol: {warm: 500, measure: 200, ramp: 200, every: 10, batches: 2},
       train: {gpus: 4, epochs: 60, global_clipnorm: 1.68e+3}}   # after lambda_D1 fixed: Q50 668, Q99 1 884
                                       # (pilot epoch 1, unclipped: norms up to 5e13, d1_kl_r 1e8, then recovered)
  c3: {context: 128, hidden: [128, 128, 128, 128, 128], time_dim: 32, standardise: true, stats_batches: 100,
       lambda_replay: 1.0, init_context_from_c2: true, ema: 0.999, val_triplets: 8,
       train: {epochs: 60, global_clipnorm: 13.3}}           # Q50 1.1, Q99 33
  eval:
    k_samples: 128                 # posterior samples per galaxy
    nfe: 40                        # Heun, 20 steps
    method: heun
    flux_aperture_px: 6
    max_examples: 5000
    relation_max_examples: 3000
    relation_min_snr: 50           # D1 Rubin / VIS shape relation measured where REGAUSS is reliable on both (2026-11-27:
    relation_max_slope_dev: 0.2    # slope 1.00 at S/N_i >= 50, 25-31 % failures below); the evaluation stops if the
    relation_max_offset: 0.05      # slope or offset departs from the identity (scripts/inspect/shape_relation.py)
    reference: vis                 # shape reference on D2: the target's REGAUSS VIS shape (vis), or through the fit (fit)
    reliable_snr: 80               # main sample (2026-11-27: shapes below S/N_i ~80 not reliable), and S/N_i >= 10
    snr_bins: [0, 10, 20, 50, 80, 100, 1.0e+9]  # R2, m, c per S/N_i bin (D1 reconstructions and D2 runs); the
                                                # exponent needs its sign: YAML reads 1.0e9 as a string
    latent_max_examples: 5000
    jacobian_n: 32
    mask_pool: 2000
    batch_size: 64
    bootstrap: 200
    cost_batch: 64
    cost_k: 10
