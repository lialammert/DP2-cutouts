# local_demo.yaml
# Anna Preto
# AstroDeep Project
# Local demo: the copaings ECDFS box (tract 5063, about 0.07 deg2, in EDF-F).
# The reference numbers are those of the copaings demo notebook.

name: local_demo
data_root: ~/data/res/demo
sky_box: [53.00, 53.30, -27.95, -27.70]   # [ra_min, ra_max, dec_min, dec_max] in degrees

rubin:
  tap_url: https://data.lsst.cloud/api/tap
  token_file: ~/.rsp_token
  table: dp2.Object
  tracts: [5063]
  margin_deg: 0.01   # TAP read margin; the exact box is applied afterwards

euclid:
  hats_url: hf://datasets/hugging-science/mmu_euclid_q1/euclid
  margin_deg: 0.01   # read margin around the box; copaings then cuts it exactly
  # Angle convention of the Euclid ellipses: "copaings" (theta = -PA, that of the copaings code, which reproduces
  # the reference) or "measured" (theta = PA + 90, the one given by matched pairs). See euclid_hf.py.
  pa_convention: copaings

# Pixels: a single square region in a single patch, cut out by SODA in all six bands.
pixels:
  tract: 5063
  patch: 34
  size_px: 1000      # side of the region, in 0.2 arcsec pixels
  center: null       # null = patch centre

copaings:
  friendly_path: ~/src/friendly
  linking_length: 3.0
  mag_cut: 35
  euclid_region: auto
  eot_dense_max: 0
  n_eot_tasks: 4
  n_sb_tasks: 4

# Cut and masking thresholds (the continuous quantities are always recorded alongside).
cuts:
  margin_px: 29            # cut 3: integer margin on all four sides, inside the patch
  stamp_px: 59             # stamp 2 x 29 + 1
  diag_px: 117             # cut 8 diagnostic stamp, 2 x 58 + 1
  bad_planes: [SATURATED, COSMIC_RAY, INTERPOLATED, DETECTION_EDGE]   # cut 5: damaged pixels
  k_ellipse: 3.0           # cut 5: minimum reduced radius of a damaged pixel, in units of the ellipse
  snr_min: 5.0             # cut 6
  aperture_radii: [29, 58] # cut 8: circular apertures, in pixels
  delta_e_max: 0.02        # cut 8 and masking decision
  shape_band: i
  sky_tries: 5000          # empty-sky window attempts per stamp
  seed: 12345

# Companion masking. "ellipse": half-light ellipse, as in the recipe. "footprint" (deviation from the recipe,
# validated on 2026-11-06): the half-light ellipse left the bright wings of companions around sky-filled holes.
# The target's detection footprint is kept whole; the other footprints are masked whole, grown by grow_px; a
# companion inside the target footprint is masked over shared_k times its ellipse.
# See stamps.companion_mask_footprint.
masking:
  method: footprint
  grow_px: 2
  shared_k: 2.0

# Packaging: cuts applied to the final dataset and planes counted in the MMU boolean mask.
package:
  apply: [cut1, cut2, in_region, cut3, cut4, cut5, cut6, cut7, cut8, mask]
  mmu_mask_planes: [NO_DATA, SATURATED, COSMIC_RAY, INTERPOLATED, DETECTION_EDGE]
  max_rows_per_file: 500

# Values from the copaings_demo.ipynb notebook (butler, same box), as a check.
reference:
  n_raw: {LSST: 14045, Euclid: 23932}
  n_after_cut: {LSST: 14044, Euclid: 23464}
  fof_groups_Euclid: 10451
  eot_groups_Euclid: 12531
  sb_merge_Euclid: {n_one_to_one_zero: 10936, n_no_overlap_minus1: 1279, n_computed: 1829}
