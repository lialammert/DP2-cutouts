# local_scale.yaml
# Anna Preto
# AstroDeep Project
# Patch-by-patch pipeline on a small local test: the 3 x 3 patches around patch 34 of tract 5063 (in EDF-F).
# Same science parameters as local_demo.yaml; the area and the data sources are the only differences.

name: local_scale
data_root: ~/data/res/scale

# Where the data come from. rubin_pixels: "soda" (off-site, with the token) or
# {kind: butler, repo: dp2, collections: [dp2]} (Rubin Science Platform / Rubin data facility).
sources:
  rubin_catalog: tap
  euclid_catalog: hf
  rubin_pixels: soda

# Patches to process: every deep_coadd patch that SIA finds in the search areas, restricted to tracts / include.
patches:
  search:
    - {ra: 53.1817, dec: -27.7706, radius_deg: 0.30}
  tracts: [5063]
  include: [23, 24, 25, 33, 34, 35, 43, 44, 45]
  catalog_margin_arcsec: 10.0   # added to the outer polygon of the patch (which already extends 30" past its inner part)

rubin:
  tap_url: https://data.lsst.cloud/api/tap
  token_file: ~/.rsp_token
  table: dp2.Object
  margin_deg: 0.01   # TAP read margin; the exact box is applied afterwards

euclid:
  hats_url: hf://datasets/hugging-science/mmu_euclid_q1/euclid
  margin_deg: 0.01
  # Angle convention of the Euclid ellipses (copaings overlap tests, companion masks): "measured" (theta = PA + 90,
  # the orientation measured on the images). "copaings" (theta = -PA) leaves the ellipses unrelated to the galaxies:
  # median 45 deg off the VIS orientation in the D1 quality report of 2026-11-18. See euclid_hf.py.
  pa_convention: measured

copaings:
  friendly_path: ~/src/friendly
  linking_length: 3.0
  mag_cut: 35
  euclid_region: auto
  eot_dense_max: 0
  n_eot_tasks: 4
  n_sb_tasks: 4

cuts:
  margin_px: 29
  stamp_px: 59
  diag_px: 117
  bad_planes: [SATURATED, COSMIC_RAY, INTERPOLATED, DETECTION_EDGE]
  k_ellipse: 3.0
  snr_min: 5.0
  aperture_radii: [29, 58]
  delta_e_max: 0.02
  shape_band: i
  sky_tries: 5000
  seed: 12345

masking:
  method: footprint
  grow_px: 2
  shared_k: 2.0

package:
  apply: [cut1, cut2, in_region, cut3, cut4, cut5, cut6, cut7, cut8, mask]
  mmu_mask_planes: [NO_DATA, SATURATED, COSMIC_RAY, INTERPOLATED, DETECTION_EDGE]
  max_rows_per_file: 500
