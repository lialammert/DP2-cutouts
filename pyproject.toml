# pyproject.toml
# Anna Preto
# AstroDeep Project
# Python package of the pipeline that builds the Rubin DP2 x Euclid Q1 stamp dataset.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dp2-cutouts"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy", "pandas<3", "pyarrow", "scipy", "astropy", "healpy", "galsim", "pyyaml",
    "requests", "pyvo", "lsdb", "huggingface_hub",
    "copaings @ git+https://github.com/LSSTDESC/copaings",
    "FoFCatalogMatching",
]

[project.optional-dependencies]
notebook = ["jupyterlab", "ipykernel", "matplotlib"]
test = ["pytest"]

[project.scripts]
dp2-cutouts = "dp2_cutouts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
